<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Studio — Rye Lane</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#202820;font:14px/1.5 Arial,sans-serif}main{display:grid;grid-template-columns:300px 1fr;height:100dvh}aside{padding:26px 22px;overflow:auto;border-right:1px solid #ddd}h1{font-size:25px;letter-spacing:-1px;margin:12px 0}p{color:#677067;font-size:12px}a{color:#17613f}label{display:block;margin:12px 0 5px;font-size:12px}select,input,button{font:inherit;border:1px solid #c9cec7;border-radius:6px;padding:8px;background:white;color:inherit;width:100%}button{cursor:pointer}button:hover{border-color:#17613f}fieldset{border:0;border-top:1px solid #d8ddd5;margin:22px 0 0;padding:12px 0 0}legend{font-weight:bold;padding:0 8px 0 0}iframe{width:100%;height:100%;border:0;background:white}.preview{display:grid;grid-template-rows:auto 1fr;min-height:0}.toolbar{padding:12px 18px;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center}.toolbar select{width:200px}.actions{display:grid;gap:10px;margin-top:24px}.primary{background:#17613f;color:white}#status{min-height:36px}@media(max-width:700px){main{height:auto;grid-template-columns:1fr}aside{max-height:55dvh}.preview{height:70dvh}.toolbar{flex-wrap:wrap}}
</style></head><body><main><aside><a href="index.html?start=street">← Back to website</a><h1>Font Studio</h1><p>Adjust the title and paper typography. Changes are saved in this browser. Export CSS to keep a reusable copy.</p><div id="controls"></div><div class="actions"><button class="primary" id="export">Export CSS</button><button id="reset">Restore default fonts</button></div><p id="status" role="status" aria-live="polite">Ready. Your original layout and drawings stay in place.</p></aside><section class="preview" aria-label="Website preview"><div class="toolbar"><label for="page">Preview</label><select id="page"><option value="paper-10.html">References</option><option value="paper.html">Paper</option><option value="index.html#title">Main title</option><option value="index.html?start=street">Street animation</option></select><span>Live preview</span></div><iframe id="preview" src="paper-10.html" title="Website font preview"></iframe></section></main><script src="source/font-settings.js"></script><script>
(()=>{'use strict';const key='rye-lane-fonts-v1',frame=document.querySelector('#preview'),status=document.querySelector('#status');let settings=RyeFonts.read();const groups=[['title','Main title',96,600,'Arial'],['headings','Paper headings',25,500,'Arial'],['body','Paper body',18,400,'Georgia']];
for(const [id,label,size,weight,family] of groups){const field=document.createElement('fieldset');field.innerHTML=`<legend>${label}</legend><label for="${id}-family">Font family</label><select id="${id}-family"><option value="">Original font</option>${['Arial','Helvetica','Georgia','Times','Verdana','Trebuchet','Courier'].map(f=>`<option value="${f}">${f==='Times'?'Times New Roman':f}</option>`).join('')}</select><label for="${id}-size">Size (px)</label><input id="${id}-size" type="number" min="10" max="${id==='title'?160:64}" placeholder="Original size"><label for="${id}-weight">Weight</label><select id="${id}-weight"><option value="">Original weight</option><option value="400">Regular</option><option value="500">Medium</option><option value="600">Semibold</option><option value="700">Bold</option></select>`;document.querySelector('#controls').append(field);for(const prop of ['family','size','weight']){const input=document.getElementById(`${id}-${prop}`);input.value=settings[id]?.[prop]??'';input.addEventListener('input',()=>{settings[id]??={};if(input.value==='')delete settings[id][prop];else settings[id][prop]=prop==='family'?input.value:Number(input.value);publish()})}}
function publish(){settings=RyeFonts.clean(settings);try{localStorage.setItem(key,JSON.stringify(settings));status.textContent='Saved in this browser. Preview updated.'}catch{status.textContent='Preview updated. Browser storage unavailable; export CSS to keep changes.'}frame.contentWindow.postMessage({type:'rye-fonts-apply',settings},'*')}
frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'rye-fonts-apply',settings},'*'));
document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value});document.querySelector('#reset').addEventListener('click',()=>{settings={};for(const field of document.querySelectorAll('#controls input,#controls select'))field.value='';publish();status.textContent='Original fonts restored.'});document.querySelector('#export').addEventListener('click',()=>{const blob=new Blob(['/* Rye Lane font overrides */\n'+RyeFonts.css(settings)+'\n'],{type:'text/css'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='rye-lane-fonts.css';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='CSS exported. Share the file to apply these fonts permanently.'});})();
</script></body></html>
